<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="820" viewBox="0 0 1080 820" role="img" aria-label="MIC AI 語音鍵盤｜應用操作流程"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#e3edfd"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1a3258" flood-opacity=".09"/></filter><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2760a7"/></marker></defs><rect width="1080" height="820" rx="30" fill="url(#bg)"/><rect x="24" y="24" width="1032" height="772" rx="27" fill="none" stroke="#d7e4ed" stroke-width="2"/><rect x="62" y="53" rx="11" width="210" height="33" fill="#2760a7"/><text x="78" y="76" fill="#fff" font-size="17" font-weight="750" font-family="Arial, sans-serif" letter-spacing="1.1">APPLICATION FLOW</text><text x="62" y="137" font-size="41" font-weight="800" fill="#142948" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">MIC AI 語音鍵盤</text><text x="62" y="170" font-size="22" font-weight="650" fill="#2760a7" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif">應用操作流程｜使用者如何完成任務</text><path d="M328 283 H403 M674 283 H747 M887 361 V430 M749 513 H677" stroke="#2760a7" stroke-width="5" fill="none" stroke-linecap="round" marker-end="url(#arr)" /><rect x="60" y="205" width="268" height="156" rx="21" fill="#fff" stroke="#d4e0ed" stroke-width="2" filter="url(#shadow)"/><rect x="78" y="223" width="42" height="38" rx="11" fill="#2760a7"/><text x="99" y="251" fill="#fff" font-size="23" text-anchor="middle" font-family="Arial" font-weight="800">01</text><text x="79" y="295" font-size="26" fill="#153052" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">切換輸入法</text><text x="79" y="327" font-size="17" fill="#687d91" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">進入 MIC 鍵盤介面</text><rect x="406" y="205" width="268" height="156" rx="21" fill="#fff" stroke="#d4e0ed" stroke-width="2" filter="url(#shadow)"/><rect x="424" y="223" width="42" height="38" rx="11" fill="#2760a7"/><text x="445" y="251" fill="#fff" font-size="23" text-anchor="middle" font-family="Arial" font-weight="800">02</text><text x="425" y="295" font-size="26" fill="#153052" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">開始錄音</text><text x="425" y="327" font-size="17" fill="#687d91" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">點按麥克風，保留音訊資料</text><rect x="752" y="205" width="268" height="156" rx="21" fill="#fff" stroke="#d4e0ed" stroke-width="2" filter="url(#shadow)"/><rect x="770" y="223" width="42" height="38" rx="11" fill="#2760a7"/><text x="791" y="251" fill="#fff" font-size="23" text-anchor="middle" font-family="Arial" font-weight="800">03</text><text x="771" y="295" font-size="26" fill="#153052" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">等待辨識</text><text x="771" y="327" font-size="17" fill="#687d91" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">送出錄音並取得語音文字</text><rect x="752" y="435" width="268" height="156" rx="21" fill="#fff" stroke="#d4e0ed" stroke-width="2" filter="url(#shadow)"/><rect x="770" y="453" width="42" height="38" rx="11" fill="#2760a7"/><text x="791" y="481" fill="#fff" font-size="23" text-anchor="middle" font-family="Arial" font-weight="800">04</text><text x="771" y="525" font-size="26" fill="#153052" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">自動回填</text><text x="771" y="557" font-size="17" fill="#687d91" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">將文字輸入目前焦點欄位</text><rect x="406" y="435" width="268" height="156" rx="21" fill="#fff" stroke="#d4e0ed" stroke-width="2" filter="url(#shadow)"/><rect x="424" y="453" width="42" height="38" rx="11" fill="#2760a7"/><text x="445" y="481" fill="#fff" font-size="23" text-anchor="middle" font-family="Arial" font-weight="800">05</text><text x="425" y="525" font-size="26" fill="#153052" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">紀錄與複製</text><text x="425" y="557" font-size="17" fill="#687d91" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">使用歷史文字或剪貼簿</text><rect x="60" y="665" width="960" height="79" rx="17" fill="#2760a7"/><text x="81" y="693" font-size="16" font-weight="700" fill="#e7ffff" font-family="Noto Sans TC, sans-serif">流程重點 / USER EXPERIENCE</text><text x="82" y="721" font-size="19" fill="#fff" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">把語音辨識直接放進輸入法，讓使用者不用切換 App 就能輸入文字。</text></svg>