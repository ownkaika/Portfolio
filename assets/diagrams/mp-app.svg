erif">開啟浮動資訊工具</text><rect x="406" y="205" width="268" height="156" rx="21" fill="#fff" stroke="#d4e0ed" stroke-width="2" filter="url(#shadow)"/><rect x="424" y="223" width="42" height="38" rx="11" fill="#087d82"/><text x="445" y="251" fill="#fff" font-size="23" text-anchor="middle" font-family="Arial" font-weight="800">02</text><text x="425" y="295" font-size="26" fill="#153052" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">查看日期時間</text><text x="425" y="327" font-size="17" fill="#687d91" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">以固定格式顯示時間資訊</text><rect x="752" y="205" width="268" height="156" rx="21" fill="#fff" stroke="#d4e0ed" stroke-width="2" filter="url(#shadow)"/><rect x="770" y="223" width="42" height="38" rx="11" fill="#087d82"/><text x="791" y="251" fill="#fff" font-size="23" text-anchor="middle" font-family="Arial" font-weight="800">03</text><text x="771" y="295" font-size="26" fill="#153052" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">拖曳浮窗</text><text x="771" y="327" font-size="17" fill="#687d91" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">調整浮動位置</text><rect x="752" y="435" width="268" height="156" rx="21" fill="#fff" stroke="#d4e0ed" stroke-width="2" filter="url(#shadow)"/><rect x="770" y="453" width="42" height="38" rx="11" fill="#087d82"/><text x="791" y="481" fill="#fff" font-size="23" text-anchor="middle" font-family="Arial" font-weight="800">04</text><text x="771" y="525" font-size="26" fill="#153052" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">觸發快捷鍵</text><text x="771" y="557" font-size="17" fill="#687d91" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">使用長按等手勢</text><rect x="406" y="435" width="268" height="156" rx="21" fill="#fff" stroke="#d4e0ed" stroke-width="2" filter="url(#shadow)"/><rect x="424" y="453" width="42" height="38" rx="11" fill="#087d82"/><text x="445" y="481" fill="#fff" font-size="23" text-anchor="middle" font-family="Arial" font-weight="800">05</text><text x="425" y="525" font-size="26" fill="#153052" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">跨 App 工作</text><text x="425" y="557" font-size="17" fill="#687d91" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">不必返回主畫面即可操作</text><rect x="60" y="665" width="960" height="79" rx="17" fill="#087d82"/><text x="81" y="693" font-size="16" font-weight="700" fill="#e7ffff" font-family="Noto Sans TC, sans-serif">流程重點 / USER EXPERIENCE</text><text x="82" y="721" font-size="19" fill="#fff" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif">把時間資訊與常用快捷操作留在其他 App 畫面上。</text></svg>